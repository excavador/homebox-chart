apiVersion: v2
name: homebox
description: HomeBox — self-hosted home inventory and organisation system
type: application
# Chart version is INDEPENDENT semver — it moves for chart changes, while
# appVersion tracks the HomeBox release. The two started aligned at 0.26.2
# and diverge from there; a chart-only fix cannot borrow an upstream
# version it does not correspond to.
#
# This value is a placeholder for local work: at release time helmctl
# injects the git tag as the authoritative version.
version: 0.26.3
# Informational only. The release tooling overwrites this with the chart's
# git tag, so nothing may depend on it — see image.tag in values.yaml.
appVersion: "0.26.2"
home: https://github.com/sysadminsmedia/homebox
sources:
  - https://github.com/sysadminsmedia/homebox
  - https://github.com/opwerm/homebox-chart
keywords: [inventory, homelab, self-hosted]
maintainers:
  - name: Oleg Tsarev
    email: oleg@tsarev.id
