apiVersion: v2
name: homebox
description: HomeBox — self-hosted home inventory and organisation system
type: application
# The chart version TRACKS the HomeBox release it packages, so `helm
# install --version 0.26.2` gets you HomeBox 0.26.2 without a lookup table.
#
# This value is a placeholder for local work: at release time helmctl
# injects the git tag as the authoritative version, so tagging v0.26.2 is
# what actually publishes 0.26.2. Renovate moves appVersion when upstream
# releases; the tag follows.
version: 0.26.2
appVersion: "0.26.2"
home: https://github.com/sysadminsmedia/homebox
sources:
  - https://github.com/sysadminsmedia/homebox
  - https://github.com/opwerm/homebox-chart
keywords: [inventory, homelab, self-hosted]
maintainers:
  - name: Oleg Tsarev
    email: oleg@tsarev.id
