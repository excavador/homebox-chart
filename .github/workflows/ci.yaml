name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same devbox environment CI and humans use, so `just check` locally
      # and `just check` here run byte-identical tool versions.
      - uses: truvity/ci-workflows/.github/actions/setup-devbox@58d470dff71c732e208f47a80bb6c5d741e016a7 # v3.25.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: devbox run -- just check
