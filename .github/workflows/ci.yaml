name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same devbox environment CI and humans use, so `just check` locally
      # and `just check` here run byte-identical tool versions.
      - uses: truvity/ci-workflows/.github/actions/setup-devbox@45d837a9aedc12fcad2ee4aa30efb0fa74289b91 # v2.16.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: devbox run -- just check
